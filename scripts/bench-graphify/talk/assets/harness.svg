<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 496" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, DejaVu Sans Mono, monospace"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs><rect x="10" y="150" width="190" height="120" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="26" y="180" font-size="19" font-weight="700" fill="#e6edf3">1 commit</text><text x="26" y="208" font-size="16" fill="#8b949e">same code</text><text x="26" y="232" font-size="16" fill="#8b949e">for everyone</text><rect x="250" y="20" width="330" height="78" rx="10" fill="#161b22" stroke="#f2cc60" stroke-width="2"/><text x="266" y="50" font-size="19" font-weight="700" fill="#f2cc60">grep agent</text><text x="266" y="78" font-size="16" fill="#8b949e">Graphify blocked</text><path d="M200 210 L246 59" stroke="#8b949e" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M580 59 L636 210" stroke="#8b949e" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="250" y="115" width="330" height="78" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="266" y="145" font-size="19" font-weight="700" fill="#3fb950">graph agent: CLI</text><text x="266" y="173" font-size="16" fill="#8b949e">graph + 1 command</text><path d="M200 210 L246 154" stroke="#8b949e" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M580 154 L636 210" stroke="#8b949e" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="250" y="210" width="330" height="78" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="266" y="240" font-size="19" font-weight="700" fill="#3fb950">graph agent: MCP</text><text x="266" y="268" font-size="16" fill="#8b949e">graph via MCP server</text><path d="M200 210 L246 249" stroke="#8b949e" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M580 249 L636 210" stroke="#8b949e" st