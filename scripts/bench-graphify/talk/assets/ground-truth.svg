<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, DejaVu Sans Mono, monospace"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs><rect x="10" y="10" width="260" height="150" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="26" y="40" font-size="19" font-weight="700" fill="#58a6ff">1  ask</text><text x="26" y="68" font-size="16" fill="#8b949e">11 questions</text><text x="26" y="92" font-size="16" fill="#8b949e">fixed JSON answer:</text><text x="26" y="116" font-size="16" fill="#8b949e">[{file, symbol}]</text><path d="M272 85 L306 85" stroke="#8b949e" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="310" y="10" width="260" height="150" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="326" y="40" font-size="19" font-weight="700" fill="#3fb950">2  derive</text><text x="326" y="68" font-size="16" fill="#8b949e">TypeScript compiler</text><text x="326" y="92" font-size="16" fill="#8b949e">call hierarchy, refs,</text><text x="326" y="116" font-size="16" fill="#8b949e">import graph</text><path d="M572 85 L606 85" stroke="#8b949e" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="610" y="10" width="260" height="150" rx="10" fill="#161b22" stroke="#f2cc60" stroke-width="2"/><text x="626" y="40" font-size="19" font-weight="700" fill="#f2cc60">3  commit</text><text x="626" y="68" font-size="16" fill="#8b949e">pass/fail thresholds</text><text x="626" y="92" font-size="16" fill="#8b949e">in git, before the</text><text x="626" y="116" font-size="16" fill="#8b949e">first agent run</text><path d="M872 85 L906 85" stroke="#8b949e" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="910" y="10" width="260" height="150" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/><text x="926" y="40" font-size="19" font-weight="700" fill="#d2a8ff">4  score</text><text x="926" y="68" font-size="16" fill="#8b949e">F1 / recall, no LLM</text><text x="926" y="92" font-size="16" fill="#8b949e">judge; re-score saved</text><text x="926" y="116" font-size="16" fill="#8b949e">answers any time</text><text x="600" y="196" font-size="17" fill="#8b949e" text-anchor="middle">never Graphify, never an LLM: a referee independent of both agents</text></svg>
