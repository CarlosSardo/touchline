<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 524" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, DejaVu Sans Mono, monospace"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs><defs><marker id="gold" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2cc60"/></marker></defs><text x="20" y="24" font-size="15" fill="#8b949e">cost per question · Copilot billing, Sonnet + grep = 100 · 7 graph-shaped questions × 3 runs</text><text x="385" y="374" font-size="19" font-weight="800" fill="#e6edf3" text-anchor="middle">Sonnet 5.5<tspan font-size="14" font-weight="400" fill="#8b949e">  big model</tspan></text><text x="875" y="374" font-size="19" font-weight="800" fill="#e6edf3" text-anchor="middle">Haiku 5.5<tspan font-size="14" font-weight="400" fill="#8b949e">  small model, ~12× cheaper per token read</tspan></text><line x1="200" y1="300" x2="1190" y2="300" stroke="#30363d" stroke-width="2"/><line x1="200" y1="70" x2="1190" y2="70" stroke="#30363d" stroke-dasharray="4 6"/><rect x="240.0" y="70" width="120" height="230" rx="6" fill="#8b949e"/><text x="300" y="60" font-size="28" font-weight="800" fill="#e6edf3" text-anchor="middle">100</text><text x="300" y="326" font-size="17" font-weight="700" fill="#8b949e" text-anchor="middle">grep</text><rect x="410.0" y="129" width="120" height="171" rx="6" fill="#3fb950"/><text x="470" y="119" font-size="28" font-weight="800" fill="#e6edf3" text-anchor="middle">74</text><text x="470" y="326" font-size="17" font-weight="700" fill="#3fb950" text-anchor="middle">+ map</text><rect x="730.0" y="274" width="120" height="26" rx="6" fill="#8b949e"/><text x="790" y="264" font-size="28" font-weight="800" fill="#e6edf3" text-anchor="middle">11</text><text x="790" y="326" font-size="17" font-weight="700" fill="#8b949e" text-anchor="middle">grep</text><rect x="900.0" y="279" width="120" height="21" rx="6" fill="#3fb950"/><text x="960" y="269" font-size="28" font-weight="800" fill="#e6edf3" text-anchor="middle">9</text><text x="960" y="326" font-size="17" font-weight="700" fill="#3fb950" text-anchor="middle">+ map</text><rect x="345.0" y="306" width="80" height="28" rx="14" fill="#0d1117" stroke="#3fb950" stroke-width="2"/><text x="385.0" y="326" font-size="16" font-weight="800" fill="#3fb950" text-anchor="middle">−26%</text><rect x="835.0" y="306" width="80" height="28" rx="14" fill="#0d1117" stroke="#3fb950" stroke-width="2"/><text x="875.0" y="326" font-size="16" font-weight="800" fill="#3fb950" text-anchor="middle">−19%</text><path d="M340 64 C 700 20, 960 20, 960 230" fill="none" stroke="#f2cc60" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#gold)"/><text x="916" y="130" font-size="22" font-weight="800" fill="#f2cc60" text-anchor="end">11× cheaper, same accuracy</text><text x="916" y="154" font-size="15" fill="#f2cc60" text-anchor="end">Haiku + map 98.9%  vs  Sonnet + grep 98.5%</text><rect x="10" y="391" width="1180" height="30" rx="4" fill="#161b22"/><text x="24" y="412" font-size="16" fill="#8b949e">accuracy<tspan font-size="13"> / question</tspan></text><text x="300" y="412" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">98.5%</text><text x="470" y="412" font-size="17" font-weight="700" fill="#3fb950" text-anchor="middle">98.9%</text><text x="790" y="412" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">98.4%</text><text x="960" y="412" font-size="17" font-weight="700" fill="#3fb950" text-anchor="middle">98.9%</text><text x="24" y="442" font-size="16" fill="#8b949e">tokens read<tspan font-size="13"> / question</tspan></text><text x="300" y="442" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">219k</text><text x="470" y="442" font-size="17" font-weight="700" fill="#3fb950" text-anchor="middle">123k</text><text x="790" y="442" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">303k</text><text x="960" y="442" font-size="17" font-weight="700" fill="#3fb950" text-anchor="middle">234k</text><rect x="10" y="451" width="1180" height="30" rx="4" fill="#161b22"/><text x="24" y="472" font-size="16" fill="#8b949e">tool calls<tspan font-size="13"> / question</tspan></text><text x="300" y="472" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">6.3</text><text x="470" y="472" font-size="17" font-weight="700" fill="#3fb950" text-anchor="middle">3.3</text><text x="790" y="472" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">8.3</text><text x="960" y="472" font-size="17" font-weight="700" fill="#3fb950" text-anchor="middle">7.0</text><text x="24" y="502" font-size="16" fill="#8b949e">time<tspan font-size="13"> / question</tspan></text><text x="300" y="502" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">36 s</text><text x="470" y="502" font-size="17" font-weight="700" fill="#3fb950" text-anchor="middle">29 s</text><text x="790" y="502" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">63 s</text><text x="960" y="502" font-size="17" font-weight="700" fill="#3fb950" text-anchor="middle">64 s</text></svg>
