<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 674" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, DejaVu Sans Mono, monospace"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs><text x="20" y="24" font-size="15" fill="#8b949e">the question you ask your agent</text><text x="660" y="24" font-size="15" fill="#8b949e">input tokens: map ÷ grep</text><text x="1190" y="24" font-size="15" fill="#8b949e" text-anchor="end">accuracy map / grep</text><line x1="880" y1="38" x2="880" y2="648" stroke="#e6edf3" stroke-dasharray="6 5" stroke-width="2" opacity="0.6"/><rect x="10" y="44" width="1180" height="30" rx="6" fill="#3fb950" fill-opacity="0.14"/><rect x="10" y="44" width="6" height="30" rx="3" fill="#3fb950"/><text x="28" y="65" font-size="16" font-weight="800" fill="#3fb950">USE THE MAP<tspan fill="#e6edf3" font-weight="400">  ·  the answer is a chain of calls across files</tspan></text><text x="640" y="98" font-size="18" fill="#e6edf3" text-anchor="end">What breaks if I change contractEndDate?</text><text x="640" y="117" font-size="13" fill="#8b949e" text-anchor="end">callers of callers, 3 hops deep</text><rect x="660" y="86" width="43" height="24" rx="4" fill="#3fb950"/><text x="711" y="105" font-size="18" font-weight="800" fill="#3fb950" stroke="#0d1117" stroke-width="5" paint-order="stroke">0.20×</text><text x="1190" y="105" font-size="17" fill="#8b949e" text-anchor="end">100 / 100</text><text x="640" y="142" font-size="18" fill="#e6edf3" text-anchor="end">What can make a rival club sign a player?</text><text x="640" y="161" font-size="13" fill="#8b949e" text-anchor="end">every chain up to the entry points</text><rect x="660" y="130" width="46" height="24" rx="4" fill="#3fb950"/><text x="714" y="149" font-size="18" font-weight="800" fill="#3fb950" stroke="#0d1117" stroke-width="5" paint-order="stroke">0.21×</text><text x="1190" y="149" font-size="17" fill="#8b949e" text-anchor="end">100 / 98</text><text x="640" y="186" font-size="18" fill="#e6edf3" text-anchor="end">Which tests should I run for transferProceeds?</text><text x="640" y="205" font-size="13" fill="#8b949e" text-anchor="end">tests that reach it within 3 hops</text><rect x="660" y="174" width="75" height="24" rx="4" fill="#3fb950"/><text x="743" y="193" font-size="18" font-weight="800" fill="#3fb950" stroke="#0d1117" stroke-width="5" paint-order="stroke">0.34×</text><text x="1190" y="193" font-size="17" fill="#8b949e" text-anchor="end">100 / 100</text><text x="640" y="230" font-size="18" fill="#e6edf3" text-anchor="end">What does executeMarketTransfer call?</text><text x="640" y="249" font-size="13" fill="#8b949e" text-anchor="end">one function&#x27;s direct callees</text><rect x="660" y="218" width="160" height="24" rx="4" fill="#3fb950"/><text x="828" y="237" font-size="18" font-weight="800" fill="#3fb950" stroke="#0d1117" stroke-width="5" paint-order="stroke">0.73×</text><text x="1190" y="237" font-size="17" fill="#8b949e" text-anchor="end">100 / 100</text><text x="640" y="274" font-size="18" fill="#e6edf3" text-anchor="end">Plan it: add a database migration</text><text x="640" y="293" font-size="13" fill="#8b949e" text-anchor="end">code + tests + docs to touch</text><rect x="660" y="262" width="175" height="24" rx="4" fill="#3fb950"/><text x="843" y="281" font-size="18" font-weight="800" fill="#3fb950" stroke="#0d1117" stroke-width="5" paint-order="stroke">0.79×</text><text x="1190" y="281" font-size="17" fill="#8b949e" text-anchor="end">100 / 100</text><text x="640" y="318" font-size="18" fill="#e6edf3" text-anchor="end">Plan it: a levy on release-clause payments</text><text x="640" y="337" font-size="13" fill="#8b949e" text-anchor="end">code + callers + tests + docs</text><rect x="660" y="306" width="177" height="24" rx="4" fill="#3fb950"/><text x="845" y="325" font-size="18" font-weight="800" fill="#3fb950" stroke="#0d1117" stroke-width="5" paint-order="stroke">0.81×</text><text x="1190" y="325" font-size="17" fill="#8b949e" text-anchor="end">100 / 96</text><rect x="10" y="348" width="1180" height="30" rx="6" fill="#8b949e" fill-opacity="0.14"/><rect x="10" y="348" width="6" height="30" rx="3" fill="#8b949e"/><text x="28" y="369" font-size="16" font-weight="800" fill="#8b949e">EITHER WAY<tspan fill="#e6edf3" font-weight="400">  ·  one search already finds it, or the link is a URL string</tspan></text><text x="640" y="402" font-size="18" fill="#e6edf3" text-anchor="end">Where is clamp defined?</text><text x="640" y="421" font-size="13" fill="#8b949e" text-anchor="end">a single grep hits the definition</text><rect x="660" y="390" width="201" height="24" rx="4" fill="#8b949e"/><text x="869" y="409" font-size="18" font-weight="800" fill="#8b949e" stroke="#0d1117" stroke-width="5" paint-order="stroke">0.91×</text><text x="1190" y="409" font-size="17" fill="#8b949e" text-anchor="end">100 / 100</text><text x="640" y="446" font-size="18" fill="#e6edf3" text-anchor="end">Trace &#x27;advance day&#x27; from the API to the match engine</text><text x="640" y="465" font-size="13" fill="#8b949e" text-anchor="end">starts at a URL route; short chain after</text><rect x="660" y="434" width="236" height="24" rx="4" fill="#8b949e"/><text x="904" y="453" font-size="18" font-weight="800" fill="#8b949e" stroke="#0d1117" stroke-width="5" paint-order="stroke">1.07×</text><text x="1190" y="453" font-size="17" fill="#8b949e" text-anchor="end">100 / 100</text><text x="640" y="490" font-size="18" fill="#e6edf3" text-anchor="end">Which screen calls GET /api/clubs/:id/transfers?</text><text x="640" y="509" font-size="13" fill="#8b949e" text-anchor="end">UI and server meet only in a URL</text><rect x="660" y="478" width="243" height="24" rx="4" fill="#8b949e"/><text x="911" y="497" font-size="18" font-weight="800" fill="#8b949e" stroke="#0d1117" stroke-width="5" paint-order="stroke">1.10×</text><text x="1190" y="497" font-size="17" fill="#8b949e" text-anchor="end">100 / 100</text><rect x="10" y="520" width="1180" height="30" rx="6" fill="#f85149" fill-opacity="0.14"/><rect x="10" y="520" width="6" height="30" rx="3" fill="#f85149"/><text x="28" y="541" font-size="16" font-weight="800" fill="#f85149">SKIP THE MAP<tspan fill="#e6edf3" font-weight="400">  ·  whole-repo audits: a small script is cheaper</tspan></text><text x="640" y="574" font-size="18" fill="#e6edf3" text-anchor="end">Which exported functions does nobody use?</text><text x="640" y="593" font-size="13" fill="#8b949e" text-anchor="end">one script counts them directly</text><rect x="660" y="562" width="291" height="24" rx="4" fill="#f85149"/><text x="959" y="581" font-size="18" font-weight="800" fill="#f85149" stroke="#0d1117" stroke-width="5" paint-order="stroke">1.32×</text><text x="1190" y="581" font-size="17" fill="#8b949e" text-anchor="end">96 / 96</text><text x="640" y="618" font-size="18" fill="#e6edf3" text-anchor="end">Which files import each other in a loop?</text><text x="640" y="637" font-size="13" fill="#8b949e" text-anchor="end">report shows a sample, agent re-checks</text><rect x="660" y="606" width="352" height="24" rx="4" fill="#f85149"/><path d="M966.0 634 l10 -32 M978.0 634 l10 -32" stroke="#0d1117" stroke-width="6"/><text x="1020" y="625" font-size="18" font-weight="800" fill="#f85149" stroke="#0d1117" stroke-width="5" paint-order="stroke">2.87×</text><text x="1190" y="625" font-size="17" fill="#8b949e" text-anchor="end">96 / 100</text><text x="880" y="666" font-size="14" fill="#e6edf3" text-anchor="middle">1.0 = same as grep</text></svg>
