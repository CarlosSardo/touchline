name: CI

# CI: full verification against throwaway PostgreSQL 18 containers, without secrets, on every pull request
# and every relevant push to main. Each job runs scripts/ci.sh, the same Dagger pipeline (.dagger/modules/touchline-ci)
# developers run locally with `npm run ci`, on a local Dagger engine in the runner's Docker. No Dagger Cloud.
# A push whose exact git tree is the one every job tested and passed on its pull request (the PR's test merge,
# whose tree that run's Plan job records in its log) reuses that result instead of running again.
# A successful push run starts CD (cd.yml): image + deploy.
on:
  # Docs/editor-only pushes skip CI. Every PR runs a stable aggregate check; its plan job skips
  # application suites when all changed paths are in this same docs/editor-only set.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".env.example"
      - ".copilot/**"
      - ".vscode/**"
      - ".mcp.json"
      - ".github/agents/**"
      - ".github/skills/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      suites:
        description: "all, or a comma list of: static,backend,world,e2e"
        type: string
        default: all
      seasons:
        description: "Seasons for npm run simulation:check (1-20)"
        type: number
        default: 3
      full_world:
        description: "Also run the season soak on the full world after the default subset (much slower)"
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ inputs.suites }}-${{ inputs.seasons }}-${{ inputs.full_world }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      static: ${{ steps.plan.outputs.static }}
      backend: ${{ steps.plan.outputs.backend }}
      world: ${{ steps.plan.outputs.world }}
      e2e: ${{ steps.plan.outputs.e2e }}
      seasons: ${{ steps.plan.outputs.seasons }}
      full_world: ${{ steps.plan.outputs.full_world }}
    steps:
      - name: Check out source
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record the tree under test
        if: github.event_name == 'pull_request'
        # Every job of this run checks out GITHUB_SHA, the PR's test merge commit (not the PR head). This log line
        # records the tree they all test; a later push of exactly that tree reuses the run (scripts/ci/verified.sh).
        run: |
          head=$(git rev-parse HEAD)
          if [[ "$head" != "$GITHUB_SHA" ]]; then echo "::error::Checked out ${head}, expected ${GITHUB_SHA}."; exit 1; fi
          marker="touchline-tested-tree=$(git rev-parse 'HEAD^{tree}') commit=${GITHUB_SHA}"
          printf '%s\n' "$marker"
          echo "Tested tree: <code>${marker}</code>" >> "$GITHUB_STEP_SUMMARY"
      - name: Reuse the pull request's verification of this exact tree
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        # Any API failure means "not verified": the suites then run in full.
        run: |
          verified=$(scripts/ci/verified.sh "$GITHUB_SHA") || true
          if [[ "$verified" != true ]]; then verified=false; fi
          echo "verified=${verified}" >> "$GITHUB_OUTPUT"
      - name: Test CI path planning
        if: github.event_name == 'pull_request'
        run: node --test scripts/ci/plan-suites.test.mjs
      - name: Determine whether application CI suites are required
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/plan-suites.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Validate inputs
        id: plan
        env:
          REUSED: ${{ steps.reuse.outputs.verified == 'true' }}
          NEEDS_CI: ${{ github.event_name != 'pull_request' || steps.scope.outputs.run == 'true' }}
          SUITES: ${{ inputs.suites }}
          SEASONS: ${{ inputs.seasons }}
          FULL_WORLD: ${{ inputs.full_world == true }}
        run: |
          if [[ "$REUSED" == true ]]; then
            for suite in static backend world e2e; do echo "${suite}=false"; done >> "$GITHUB_OUTPUT"
            { echo "seasons=3"; echo "full_world=false"; } >> "$GITHUB_OUTPUT"
            echo "Verified: this exact tree already passed every job on its pull request (see the Plan log)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$NEEDS_CI" != true ]]; then
            for suite in static backend world e2e; do echo "${suite}=false"; done >> "$GITHUB_OUTPUT"
            { echo "seasons=3"; echo "full_world=false"; } >> "$GITHUB_OUTPUT"
            echo "Documentation/editor-only PR: application CI suites are intentionally skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          suites="${SUITES:-all}"
          suites="${suites//[[:space:]]/}"
          SEASONS="${SEASONS:-3}"
          if [[ "$suites" == all ]]; then suites=static,backend,world,e2e; fi
          IFS=, read -ra selected <<< "$suites"
          if (( ${#selected[@]} == 0 )); then echo "::error::No suites selected."; exit 1; fi
          for suite in "${selected[@]}"; do
            case "$suite" in
              static|backend|world|e2e) ;;
              *) echo "::error::Unknown suite '${suite}'. Use all or a comma list of static,backend,world,e2e."; exit 1 ;;
            esac
          done
          if ! [[ "$SEASONS" =~ ^[0-9]+$ ]] || (( SEASONS < 1 || SEASONS > 20 )); then
            echo "::error::seasons must be a whole number from 1 to 20."
            exit 1
          fi
          for suite in static backend world e2e; do
            if [[ ",${suites}," == *",${suite},"* ]]; then echo "${suite}=true"; else echo "${suite}=false"; fi
          done >> "$GITHUB_OUTPUT"
          { echo "seasons=${SEASONS}"; echo "full_world=${FULL_WORLD}"; } >> "$GITHUB_OUTPUT"
          echo "Suites: ${suites} | simulation seasons: ${SEASONS} | full world: ${FULL_WORLD}" >> "$GITHUB_STEP_SUMMARY"

  static:
    name: Lint, build and pure tests
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint, build and pure tests (scripts/ci.sh static)
        run: scripts/ci.sh static
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-logs-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: SQL-backed backend tests (${{ matrix.shard }}/3)
    needs: [plan, static]
    if: ${{ !cancelled() && needs.plan.outputs.backend == 'true' && needs.static.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Database-isolated shards balanced by scripts/ci/test-timings.json; 3 must match BACKEND_SHARDS in the module.
        shard: [1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Backend tests, shard ${{ matrix.shard }}/3, against a disposable PostgreSQL 18 (scripts/ci.sh backend)
        run: scripts/ci.sh backend --shard=${{ matrix.shard }}/3
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ matrix.shard }}-logs-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  world:
    name: World and multi-season simulation checks
    needs: [plan, static]
    if: ${{ !cancelled() && needs.plan.outputs.world == 'true' && needs.static.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: World, simulation, footprint and backup / reset smoke (scripts/ci.sh world)
        env:
          SEASONS: ${{ needs.plan.outputs.seasons }}
          FULL_WORLD: ${{ needs.plan.outputs.full_world }}
        run: scripts/ci.sh world "--seasons=${SEASONS}" "--full-world=${FULL_WORLD}"
      - name: Upload world and simulation reports
        # Uploaded on success too: the JSON reports are the multi-season evidence.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-simulation-reports-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Playwright e2e (${{ matrix.shard }}/2)
    needs: [plan, static]
    if: ${{ !cancelled() && needs.plan.outputs.e2e == 'true' && needs.static.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Spec-file shards, each with its own PostgreSQL and servers; 2 must match E2E_SHARDS in the module.
        shard: [1, 2]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Playwright e2e, shard ${{ matrix.shard }}/2, against a disposable PostgreSQL 18 (scripts/ci.sh e2e)
        run: scripts/ci.sh e2e --shard=${{ matrix.shard }}/2
      - name: Upload Playwright report and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.shard }}-report-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required CI
    needs: [plan, static, backend, world, e2e]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require each planned result, allowing only explicit skips
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          STATIC_REQUIRED: ${{ needs.plan.outputs.static }}
          STATIC_RESULT: ${{ needs.static.result }}
          BACKEND_REQUIRED: ${{ needs.plan.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          WORLD_REQUIRED: ${{ needs.plan.outputs.world }}
          WORLD_RESULT: ${{ needs.world.result }}
          E2E_REQUIRED: ${{ needs.plan.outputs.e2e }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [[ "$PLAN_RESULT" != success ]]; then
            echo "::error::CI planning did not succeed (result: ${PLAN_RESULT})."
            exit 1
          fi
          check_suite() {
            local name="$1" required="$2" result="$3"
            if [[ "$required" == true && "$result" != success ]]; then
              echo "::error::Required ${name} suite did not pass (result: ${result})."
              return 1
            fi
            if [[ "$required" != true && "$result" != skipped ]]; then
              echo "::error::Unplanned ${name} suite did not skip cleanly (result: ${result})."
              return 1
            fi
          }
          check_suite static "$STATIC_REQUIRED" "$STATIC_RESULT"
          check_suite backend "$BACKEND_REQUIRED" "$BACKEND_RESULT"
          check_suite world "$WORLD_REQUIRED" "$WORLD_RESULT"
          check_suite e2e "$E2E_REQUIRED" "$E2E_RESULT"
          echo "All planned CI suites passed; unplanned suites were explicitly skipped." >> "$GITHUB_STEP_SUMMARY"
