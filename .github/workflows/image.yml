name: image

# Builds the multi-arch release image (linux/amd64 + linux/arm64 for the Raspberry Pi) and pushes it to GHCR
# as :sha-<commit>, plus :latest from main. It runs scripts/ci.sh publish, the touchline-ci Dagger module's
# Dockerfile build on a local Dagger engine (no Dagger Cloud); `scripts/ci.sh image` builds the same image
# locally without pushing. On the Pi: docker compose pull app && docker compose up -d
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push (scripts/ci.sh publish)
        env:
          IMAGE_REPOSITORY: ghcr.io/carlossardo/touchline
          # A dispatch from another branch pushes only its commit tag; :latest moves with main.
          IMAGE_TAGS: sha-${{ github.sha }}${{ github.ref == 'refs/heads/main' && ',latest' || '' }}
          SOURCE_REVISION: ${{ github.sha }}
          REGISTRY_USER: ${{ github.repository_owner }}
          # GITHUB_TOKEN needs this repo as Write under the package's "Manage Actions access"; GHCR_PUSH_TOKEN is the fallback.
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: scripts/ci.sh publish
