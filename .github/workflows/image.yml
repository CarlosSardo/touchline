name: image

# Builds the multi-arch release image (linux/amd64 + linux/arm64 for the Raspberry Pi) and pushes it to GHCR
# as :sha-<commit> and :latest. On the Pi: docker compose pull app && docker compose up -d
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the production-dependency stage runs emulated; the UI build runs natively ($BUILDPLATFORM).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # GITHUB_TOKEN needs this repo as Write under the package's "Manage Actions access"; GHCR_PUSH_TOKEN is the fallback.
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/carlossardo/touchline:sha-${{ github.sha }}
            ghcr.io/carlossardo/touchline:latest
      - name: Report digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "IMAGE=ghcr.io/carlossardo/touchline@${DIGEST} REVISION=${GITHUB_SHA}"
          {
            echo "Image: \`ghcr.io/carlossardo/touchline@${DIGEST}\` (revision \`${GITHUB_SHA}\`, linux/amd64 + linux/arm64)"
            echo ""
            echo "Pin it on the Pi with \`TOUCHLINE_IMAGE=ghcr.io/carlossardo/touchline@${DIGEST}\` in \`.env\`, then \`docker compose pull app && docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
