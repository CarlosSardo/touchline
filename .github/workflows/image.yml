name: image

# Builds the release image on GitHub (no local Docker) and pushes it to private GHCR by commit.
# azure-deploy.sh --image ships a digest only if its revision label equals the clean deploy checkout's HEAD.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # GITHUB_TOKEN needs this repo as Write under the package's "Manage Actions access"; GHCR_PUSH_TOKEN is the fallback.
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: ghcr.io/carlossardo/touchline:sha-${{ github.sha }}
      - name: Report digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "IMAGE=ghcr.io/carlossardo/touchline@${DIGEST} REVISION=${GITHUB_SHA}"
          {
            echo "Image: \`ghcr.io/carlossardo/touchline@${DIGEST}\` (revision \`${GITHUB_SHA}\`)"
            echo ""
            echo "Deploy from a clean checkout of that revision: \`bash scripts/azure-deploy.sh --yes --verification smoke --image ghcr.io/carlossardo/touchline@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
