name: CD

# Continuous deployment. After CI (verify.yml) succeeds for a push to main, publish that commit's multi-arch
# image (linux/amd64 + linux/arm64) to GHCR and deploy it to the Raspberry Pi. Only the newest commit on main
# is released, and the Pi never moves to an older commit. The jobs run the same scripts as a developer would:
# scripts/ci.sh publish and scripts/ci/cd.sh (around scripts/deploy.sh). No stored secrets: GHCR uses the
# job's short-lived GITHUB_TOKEN, and Tailscale trusts GitHub's OIDC token for the production environment
# (workload identity federation; setup in README, "Continuous deployment").
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; a newer one waits and replaces any older one still waiting.
concurrency:
  group: cd
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release candidate
    # Only full CI runs of pushes to main (manual CI runs may skip suites); manual CD runs release main.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      release: ${{ steps.candidate.outputs.release }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Newest verified commit on main?
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          release=$(scripts/ci/cd.sh candidate "$SHA")
          { echo "sha=$SHA"; echo "release=$release"; } >> "$GITHUB_OUTPUT"
          echo "Release candidate \`${SHA:0:12}\`: ${release}" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Publish image
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - name: Build, push and verify the multi-arch image (scripts/ci.sh publish)
        env:
          IMAGE_REPOSITORY: ghcr.io/carlossardo/touchline
          IMAGE_TAGS: sha-${{ needs.release.outputs.sha }},latest
          SOURCE_REVISION: ${{ needs.release.outputs.sha }}
          REGISTRY_USER: ${{ github.repository_owner }}
          # GITHUB_TOKEN needs this repo as Write under the package's "Manage Actions access"; GHCR_PUSH_TOKEN is the fallback.
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: scripts/ci.sh publish

  deploy:
    name: Deploy to the Raspberry Pi
    needs: [release, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://touchline.sardohome.duckdns.org
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      SHA: ${{ needs.release.outputs.sha }}
    steps:
      - name: Tailscale trust credential configured?
        id: tailscale
        env:
          CLIENT_ID: ${{ vars.TS_OAUTH_CLIENT_ID }}
          AUDIENCE: ${{ vars.TS_AUDIENCE }}
          HAS_SECRET: ${{ secrets.TS_OAUTH_SECRET != '' }}
        run: |
          if [[ -n "$CLIENT_ID" && ( -n "$AUDIENCE" || "$HAS_SECRET" == true ) ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Image published; deploy skipped: set the Actions variables TS_OAUTH_CLIENT_ID and TS_AUDIENCE (README, Continuous deployment)."
            echo "Deploy skipped: the Tailscale trust credential is not configured yet (README, Continuous deployment)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out source
        if: steps.tailscale.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          # Full history: cd.sh compares the running commit with this one (never downgrade).
          fetch-depth: 0
          persist-credentials: false
      - name: Join the tailnet (ephemeral tag:ci node)
        if: steps.tailscale.outputs.ready == 'true'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: raspberrypi
      - name: Deploy and verify (scripts/ci/cd.sh deploy)
        if: steps.tailscale.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_HOST: carlos@raspberrypi
          DEPLOY_SSH_OPTS: -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/known_hosts
        run: scripts/ci/cd.sh deploy "$SHA"
