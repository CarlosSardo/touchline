name: Docs

# Builds and verifies the static documentation site in docs/ (Astro + Tailwind CSS + Pagefind) on pull requests
# and relevant pushes to main (docs/src/lib/routes.mjs ROOT_DOCS lists the root Markdown rendered in place).
# Every PR builds the site, including stacked PRs; docs-maintenance.yml owns the required docs verification context.
# The site is an isolated npm package: app CI (ci.yml, the Dagger pipeline)
# ignores docs/** and Markdown, and this workflow never builds or deploys the game.
# Pages only receives a site whose build and link/anchor/search checks passed, so a failing change leaves the
# last published site in place.
# Publishing to GitHub Pages is opt-in: enable Pages with "GitHub Actions" as the source, then set the
# repository variable DOCS_PAGES_ENABLED to "true". Until then, main builds only validate the site.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "DEVELOPMENT.md"
      - ".nvmrc"
      - ".github/workflows/docs.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: docs

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Configure Pages
        id: pages
        if: env.PUBLISH == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install
        run: npm ci

      - name: Type-check, build, then check links, anchors and the search index
        env:
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '' }}
        run: npm run verify

      - name: Upload Pages artifact
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: docs-pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
