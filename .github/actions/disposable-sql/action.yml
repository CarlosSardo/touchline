name: Disposable SQL Server
description: >-
  CI equivalent of scripts/test-local.ts. Starts a throwaway SQL Server 2022 Developer
  container on 127.0.0.1:14330 with an in-job random sa password, creates touchline_checks
  and exports the same SQL_* environment that test-local.ts gives its command.
runs:
  using: composite
  steps:
    - name: Start SQL Server 2022 Developer on 127.0.0.1:14330
      shell: bash
      run: |
        set -euo pipefail
        password="Tl!$(openssl rand -hex 24)9a"
        echo "::add-mask::${password}"
        # 14330 and sa are required: server/accounts.test.ts runs its provisioning regression only there.
        MSSQL_SA_PASSWORD="$password" docker run --detach --name touchline-sql \
          --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD \
          --env MSSQL_MEMORY_LIMIT_MB=3072 \
          --publish 127.0.0.1:14330:1433 \
          --health-cmd 'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -t 5 -Q "SELECT 1" -o /dev/null' \
          --health-interval 10s --health-timeout 15s --health-retries 12 --health-start-period 30s \
          mcr.microsoft.com/mssql/server:2022-latest > /dev/null
        status=starting
        for _ in $(seq 36); do
          status="$(docker inspect --format '{{.State.Health.Status}}' touchline-sql)"
          if [[ "$status" == healthy || "$status" == unhealthy ]]; then break; fi
          sleep 5
        done
        if [[ "$status" != healthy ]]; then
          docker logs --tail 100 touchline-sql || true
          echo "::error::SQL Server container is ${status} after 180 s."
          exit 1
        fi
        SQLCMDPASSWORD="$password" docker exec --env SQLCMDPASSWORD touchline-sql \
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b \
          -Q "IF DB_ID(N'touchline_checks') IS NULL CREATE DATABASE [touchline_checks];"
        {
          echo "SQL_SERVER=127.0.0.1"
          echo "SQL_PORT=14330"
          echo "SQL_DATABASE=touchline_checks"
          echo "SQL_USER=sa"
          echo "SQL_PASSWORD=${password}"
          echo "SQL_ENCRYPT=true"
          echo "SQL_TRUST_SERVER_CERTIFICATE=true"
          echo "SQL_ALLOW_REMOTE_TESTS=false"
          echo "SQL_TEST_DATABASE="
          echo "SQL_INTEGRATION_TESTS=true"
          echo "SQL_SAVE_TESTS=true"
          echo "SQL_TEST_MODE=true"
          echo "SQL_SCHEMA=touchline_test_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        } >> "$GITHUB_ENV"
        echo "SQL Server is healthy on 127.0.0.1:14330 and touchline_checks exists."
